<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗新規登録</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta3/css/bootstrap.min.css}" />
  <script th:src="@{/webjars/bootstrap/5.0.0-beta3/js/bootstrap.min.js}" type="text/javascript"></script>
  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      font-size: 2rem;
      color: #007bff;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1rem;
      color: #dc3545;
      margin-bottom: 1rem;
      text-align: center;
    }
    form div {
      margin-bottom: 1rem;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: block;
    }
    label.required::before {
      content: '*';
      color: red;
      margin-right: 0.5rem;
    }
    input[type="text"], input[type="password"] {
      border: 1px solid #ced4da;
      border-radius: 0.5rem;
      padding: 0.5rem;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group + .form-group {
      margin-top: 1rem; /* 次の項目との間隔 */
    }
    .hint {
      font-size: 0.85rem;
      color: #6c757d;
      margin-top: 0.25rem;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-primary.text-white {
      color: white;
      text-transform: uppercase;
    }
    .btn-warning {
      background-color: #d9d6d6;
      border: 2px solid black;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      color: black;
    }
    .btn-warning:hover {
      background-color: #5a6268;
      color: white;
    }
    @media (max-width: 576px) {
      input[type="text"], input[type="password"] {
        width: 100%;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>店舗新規登録</h1>

    <!-- エラーメッセージ -->
    <h2 th:if="${isShopAlreadyExistsError}" class="text-danger">この店舗ログインIDは登録済みです</h2>
    <h2 th:if="${isShopFormError}" class="text-danger">入力内容に誤りがあります</h2>
    <h2 th:if="${isPasswordConfirmError}" class="text-danger">パスワードが一致していません</h2>

    <!-- フォーム -->
    <form method="post" th:action="@{/shop/register/confirm}" th:object="${shopForm}">
      <div>
        <label for="shopId" class="required">希望する店舗ログインID:</label>
        <input type="text" id="shopId" th:field="*{shopId}" pattern="[0-9a-zA-Z_\\-]+" placeholder="英数字、ハイフン、アンダーバーのみ可" required />
      </div>

      <div>
        <label for="shopName" class="required">店舗名 (お客様に提示されます):</label>
        <input type="text" id="shopName" th:field="*{shopName}" required />
      </div>

      <div>
        <label for="password" class="required">パスワード:</label>
        <input type="password" id="password" th:field="*{password}" minlength="8" placeholder="8文字以上" required />
        <div class="hint">8文字以上で設定してください</div>
      </div>

      <div>
        <label for="passwordConfirm" class="required">パスワード (確認用):</label>
        <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" minlength="8" required />
      </div>

      <div>
        <input class="btn btn-primary text-white" type="submit" value="確認画面へ">
      </div>
    </form>

    <!-- キャンセルボタン -->
    <form method="get" th:action="@{/shop/login}">
      <input class="btn btn-warning" type="submit" value="やめる">
    </form>
  </div>
</body>
</html>
