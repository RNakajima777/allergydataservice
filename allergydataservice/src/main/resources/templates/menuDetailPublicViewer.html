<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メニュー詳細</title>
  <link th:href="@{/webjars/bootstrap/5.0.0-beta3/css/bootstrap.min.css}" rel="stylesheet"/>
  <script type="text/javascript" th:src="@{/webjars/bootstrap/5.0.0-beta3/js/bootstrap.min.js}"></script>
  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      box-sizing: border-box;
    }
    h1 {
      font-size: 2rem;
      color: #007bff;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.5rem;
      color: #000;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    label {
      font-weight: bold;
      color: #000;
      display: inline;
      margin-right: 5px;
    }
    span {
      color: #212529;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    ul {
      padding-left: 1.5rem;
      list-style-type: disc;
    }
    ul li {
      margin-bottom: 1rem;
    }
    .menu-image {
      max-width: 100%;
      max-height: 240px;
      border-radius: 0.5rem;
      display: block;
    }
    .menu-noimage {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 4 / 3;
      background-color: #f1f3f5;
      color: #adb5bd;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* アレルゲンマトリクス(閲覧用・表形式) */
    .allergen-table-scroll {
      overflow-x: auto;
    }
    .allergen-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .allergen-table th,
    .allergen-table td {
      border-bottom: 1px solid #eee;
      padding: 0.4rem 0.5rem;
    }
    .allergen-table td.allergen-mark {
      text-align: right;
      font-weight: bold;
      width: 4rem;
      white-space: nowrap;
    }
    .allergen-table tr.allergen-group-row td {
      background-color: #e9ecef;
      font-weight: bold;
    }
    .allergen-table tr.mandatory-row {
      background-color: #fff8e1;
    }

    .btn-warning {
      display: block;
      box-sizing: border-box;
      background-color: #d9d6d6;
      border: 2px solid black;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      flex: 1;
      text-align: center;
      text-decoration: none;
      width: 100%;
      color: black;
    }
    .btn-warning:hover {
      background-color: #5a6268;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>メニュー詳細</h1>
    <h2 th:text="${categoryName} + '：' + ${menu.menuName}"></h2>

    <div class="form-group" th:if="${filterActive and menuJudgementMark != null}">
      <label>あなたの判定:</label>
      <span th:text="${menuJudgementMark}"></span>
    </div>

    <div class="form-group">
      <label>メニュー画像:</label><br>
      <img class="menu-image" th:if="${menu.imagePath != null}" th:src="@{${menu.imagePath}}" alt="メニュー画像">
      <div class="menu-noimage" th:if="${menu.imagePath == null}">画像なし</div>
    </div>

    <div class="form-group">
      <label>値段:</label>
      <span th:text="${menu.price} + '円'"></span>
    </div>

    <div class="form-group">
      <label>アレルギー情報(主要29品目):</label>
      <div class="allergen-table-scroll">
        <table class="allergen-table">
          <colgroup>
            <col>
            <col style="width: 4rem;">
          </colgroup>
          <tbody>
            <th:block th:each="af, stat : ${allergenForms}">
              <tr class="allergen-group-row" th:if="${stat.index == 0}">
                <td colspan="2">特定原材料9品目</td>
              </tr>
              <tr class="allergen-group-row" th:if="${stat.index == mandatoryAllergenCount}">
                <td colspan="2">特定原材料に準ずるもの20品目</td>
              </tr>
              <tr th:classappend="${stat.index < mandatoryAllergenCount} ? 'mandatory-row'">
                <td th:text="${af.allergenName}"></td>
                <td class="allergen-mark" th:text="${af.displayMark}"></td>
              </tr>
            </th:block>
          </tbody>
        </table>
      </div>
    </div>

    <div class="form-group">
      <label>原産地情報:</label>
      <p th:if="${#lists.isEmpty(origins)}">なし</p>
      <ul th:if="${!#lists.isEmpty(origins)}">
        <li th:each="origin : ${origins}">
          <label>食材:</label>
          <span th:text="${origin.ingredientName}"></span>
          <br>
          <label>原産地:</label>
          <span th:text="${origin.producingArea != null and !origin.producingArea.isEmpty()} ? ${origin.producingArea} : 'なし'"></span>
        </li>
      </ul>
    </div>

    <div class="form-group">
      <label>特記事項:</label>
      <span th:text="${menu.comment != null and !menu.comment.isEmpty()} ? ${menu.comment} : 'なし'"></span>
    </div>

    <a class="btn btn-warning"
       th:href="@{/shop/{shopId}/customer/main(shopId=${shopId},uid=${uid},filterActive=${filterActive},filterAllergenId=${filterAllergenId},filterTolerance=${filterTolerance})}">もどる</a>
  </div>
</body>
</html>
