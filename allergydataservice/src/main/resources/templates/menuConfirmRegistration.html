<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メニュー登録確認</title>
  <link th:href="@{/webjars/bootstrap/5.0.0-beta3/css/bootstrap.min.css}" rel="stylesheet"/>
  <script type="text/javascript" th:src="@{/webjars/bootstrap/5.0.0-beta3/js/bootstrap.min.js}"></script>
  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 700px;
      width: 90%;
      box-sizing: border-box;
    }
    form > div {
      margin-bottom: 15px;
    }
    h1 {
      font-size: 2rem;
      color: #007bff;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.5rem;
      color: #000;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    label {
      font-weight: bold;
      color: #000;
      display: block;
      margin-bottom: 0.5rem;
    }
    span {
      color: #212529;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    ul {
      padding-left: 1.5rem;
      list-style-type: disc;
    }
    ul li {
      margin-bottom: 1rem;
    }
    .menu-image {
      max-width: 100%;
      max-height: 240px;
      border-radius: 0.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .btn-container {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-warning {
      background-color: #d9d6d6;
      border: 2px solid black;
      border-radius: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      flex: 1;
      text-align: center;
      width: 100%;
      color: black;
    }
    .btn-warning:hover {
      background-color: #5a6268;
      color: white;
    }

    /* アレルゲンマトリクス(閲覧用・表形式) */
    .allergen-table-scroll {
      overflow-x: auto;
    }
    .allergen-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .allergen-table th,
    .allergen-table td {
      border-bottom: 1px solid #eee;
      padding: 0.4rem 0.5rem;
    }
    .allergen-table td.allergen-mark {
      text-align: right;
      font-weight: bold;
      width: 4rem;
      white-space: nowrap;
    }
    .allergen-table tr.allergen-group-row td {
      background-color: #e9ecef;
      font-weight: bold;
    }
    .allergen-table tr.mandatory-row {
      background-color: #fff8e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>メニュー登録確認</h1>
    <h2 th:text="${categoryName}"></h2>

    <form th:action="@{/shop/{shopId}/menu/register(shopId=${shopId})}" th:object="${menuForm}" method="post">
      <input type="hidden" th:field="*{categoryId}">
      <input type="hidden" th:field="*{imagePath}">

      <div class="form-group">
        <label>メニュー名:</label>
        <span th:text="*{menuName}"></span>
        <input type="hidden" th:field="*{menuName}">
      </div>

      <div class="form-group">
        <label>メニュー画像:</label><br>
        <img class="menu-image" th:if="${menuForm.imagePath != null}" th:src="@{${menuForm.imagePath}}" alt="メニュー画像">
        <span th:if="${menuForm.imagePath == null}">画像なし</span>
      </div>

      <div class="form-group">
        <label>値段:</label>
        <span th:text="*{price} + '円'"></span>
        <input type="hidden" th:field="*{price}">
      </div>

      <div class="form-group">
        <label>アレルギー情報(主要29品目):</label>
        <div class="allergen-table-scroll">
          <table class="allergen-table">
            <colgroup>
              <col>
              <col style="width: 4rem;">
            </colgroup>
            <tbody>
              <th:block th:each="af, stat : *{allergenForms}">
                <tr class="allergen-group-row" th:if="${stat.index == 0}">
                  <td colspan="2">特定原材料9品目</td>
                </tr>
                <tr class="allergen-group-row" th:if="${stat.index == mandatoryAllergenCount}">
                  <td colspan="2">特定原材料に準ずるもの20品目</td>
                </tr>
                <tr th:classappend="${stat.index < mandatoryAllergenCount} ? 'mandatory-row'">
                  <td>
                    <span th:text="${af.allergenName}"></span>
                    <input type="hidden" th:field="*{allergenForms[__${stat.index}__].allergenid}">
                    <input type="hidden" th:field="*{allergenForms[__${stat.index}__].allergenName}">
                    <input type="hidden" th:field="*{allergenForms[__${stat.index}__].presenceType}">
                  </td>
                  <td class="allergen-mark" th:text="${af.displayMark}"></td>
                </tr>
              </th:block>
            </tbody>
          </table>
        </div>
      </div>

      <div class="form-group">
        <label>原産地情報:</label>
        <p th:if="${#lists.isEmpty(menuForm.originForms)}">なし</p>
        <ul th:if="${!#lists.isEmpty(menuForm.originForms)}">
          <li th:each="originForm, stat : *{originForms}">
            <label>食材:</label>
            <span th:text="${originForm.ingredientName}"></span>
            <input type="hidden" th:field="*{originForms[__${stat.index}__].ingredientName}">
            <br>
            <label>原産地:</label>
            <span th:text="${originForm.producingArea != null and !originForm.producingArea.isEmpty()} ? ${originForm.producingArea} : 'なし'"></span>
            <input type="hidden" th:field="*{originForms[__${stat.index}__].producingArea}">
          </li>
        </ul>
      </div>

      <div class="form-group">
        <label>特記事項:</label>
        <span th:text="${menuForm.comment != null and !menuForm.comment.isEmpty()} ? ${menuForm.comment} : 'なし'"></span>
        <input type="hidden" th:field="*{comment}">
      </div>

      <div class="btn-container">
        <button type="submit" class="btn-primary">登録する</button>
      </div>
    </form>

    <form>
      <input type="button" class="btn-warning" value="もどる" onClick="history.go(-1);">
    </form>
  </div>
</body>
</html>
