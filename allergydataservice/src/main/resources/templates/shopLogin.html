<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗ログイン</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.0.0-beta3/css/bootstrap.min.css}" />
  <script th:src="@{/webjars/bootstrap/5.0.0-beta3/js/bootstrap.min.js}" type="text/javascript"></script>
  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      text-align: center;
    }
    h1 {
      /* 画面幅に応じてフォントサイズを調整し、改行を防ぐ */
      font-size: clamp(1.4rem, 7.5vw, 2.2rem);
      color: #007bff;
      margin-bottom: 1.5rem;
    }
    h2 {
      font-size: 1.25rem;
      margin: 1rem 0;
    }
    .text-danger {
      font-size: 1rem;
      color: #dc3545;
    }
    form {
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }
    label {
      font-weight: bold;
      margin-bottom: 0.5rem;
      display: block;
    }
    .form-control {
      border-radius: 0.5rem;
      border: 1px solid #ced4da;
      padding: 0.5rem;
      width: 100%;
      box-sizing: border-box;
    }
    .btn {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    .btn-primary {
      background-color: #007bff;
      border: none;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .mb-3 {
      margin-bottom: 1.5rem !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>店舗ログイン</h1>

    <!-- エラーメッセージ -->
    <h2 th:if="${isShopLoginFormError}" class="text-danger">店舗IDまたはパスワードの形式に誤りがあります</h2>
    <h2 th:if="${isShopLoginFailedError}" class="text-danger">店舗IDまたはパスワードが一致しません</h2>

    <!-- ログインフォーム -->
    <form method="post" th:action="@{/shop/login}" th:object="${shopLoginForm}">
      <div class="form-group">
        <label for="shopId">店舗ログインID</label>
        <input class="form-control" type="text" id="shopId" th:field="*{shopId}" pattern="[0-9a-zA-Z_\\-]+" placeholder="店舗ログインID" required>
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input class="form-control" type="password" id="password" th:field="*{password}" placeholder="パスワード" required>
      </div>
      <div class="mb-3">
        <input class="btn btn-primary" type="submit" value="ログイン">
      </div>
    </form>

    <h2 class="mb-3">または</h2>

    <!-- 新規登録ボタン -->
    <form method="get" th:action="@{/shop/signup}">
      <input class="btn btn-primary mb-3" type="submit" value="新規登録">
    </form>
  </div>
</body>
</html>
