<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗の退会</title>
  <link th:href="@{/webjars/bootstrap/5.0.0-beta3/css/bootstrap.min.css}" rel="stylesheet"/>
  <script type="text/javascript" th:src="@{/webjars/bootstrap/5.0.0-beta3/js/bootstrap.min.js}"></script>
  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      font-size: 2rem;
      color: #dc3545;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    table.table {
      margin-bottom: 1.5rem;
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.5rem;
    }
    table.table th, table.table td {
      padding: 0.75rem 1rem;
      background-color: #f8f9fa;
      border-radius: 0.5rem;
    }
    table.table th {
      text-align: left;
      color: #495057;
      font-weight: bold;
    }
    table.table td {
      color: #212529;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .btn-danger {
      background-color: #dc3545;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      color: #fff;
    }
    .btn-danger:hover {
      background-color: #c82333;
    }
    .btn-warning {
      background-color: #d9d6d6;
      border: 2px solid black;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      color: black;
    }
    .btn-warning:hover {
      background-color: #5a6268;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
        以下の店舗情報は削除されます。<br>
        登録済みのカテゴリ・メニューもすべて削除されます。<br>
        本当によろしいですか？
    </h1>
    <table class="table">
      <tbody>
        <tr>
          <th scope="row">店舗ログインID</th>
          <td>[[${shopId}]]</td>
        </tr>
        <tr>
          <th scope="row">店舗名</th>
          <td>[[${shopName}]]</td>
        </tr>
      </tbody>
    </table>
    <div class="btn-container">
      <form method="post" th:action="@{/shop/{shopId}/delete(shopId=${shopId})}">
        <input class="btn btn-danger" type="submit" value="退会する">
      </form>
      <form method="get" th:action="@{/shop/{shopId}/main(shopId=${shopId})}">
        <input class="btn btn-warning" type="submit" value="もどる">
      </form>
    </div>
  </div>
</body>
</html>
